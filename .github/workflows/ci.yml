name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - run: go vet ./...

      - run: go vet -tags authdemo ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      # The demo path only exists under the authdemo tag, so it needs a run of its own.
      - name: Test (authdemo)
        run: go test -race -tags authdemo ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: Lint the demo build
        run: golangci-lint run --build-tags authdemo ./...
